name: Pre-flight Quality Checks

on:
  pull_request:
    branches:
      - main
      - preview
  push:
    branches:
      - main
      - preview
  workflow_dispatch:

concurrency:
  group: preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Enforce Branch Flow Policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify branch flow compliance
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          BASE="$PR_BASE_REF"
          HEAD="$PR_HEAD_REF"
          echo "Base branch (target): $BASE"
          echo "Head branch (source): $HEAD"

          # Strict flow policy:
          # feature/*, fix/* -> preview -> main
          if [ "$BASE" = "main" ]; then
            if [ "$HEAD" != "preview" ]; then
              echo "::error::[Branch Policy Violation] 禁止直接向 main 分支合并！main 只能接收来自 preview 分支的 PR（标准流向: feature -> preview -> main）。当前来源: $HEAD"
              exit 1
            fi
          fi
          echo "Branch policy check passed: $HEAD -> $BASE is compliant."

  check:
    name: Lint, Test & Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter and Environment
        uses: ./.github/actions/setup

      - name: Static Analysis
        run: dart analyze --fatal-infos

      - name: Verify Clean Working Tree after Code Generation
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated code drift detected! Please run 'dart run build_runner build --delete-conflicting-outputs' and 'flutter gen-l10n', then commit the updated files."
            git diff
            exit 1
          fi

      - name: Run Flutter Tests
        run: flutter test

      - name: Run Python CI Automation Tests
        run: |
          python3 -m unittest discover -s .github/scripts/tests/
          python3 -m unittest discover -s .github/scripts/

      - name: Pre-release Metadata & Consistency Check
        run: |
          if [ "${{ github.base_ref || github.ref_name }}" = "main" ]; then
            python3 tool/pre_release_check.py --ci
          else
            python3 tool/pre_release_check.py --ci --prerelease
          fi

  security:
    name: Security Scans (PR diff)
    # 三个扫描合并到同一个 runner：避免重复启动和多次全量 checkout
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPORTS: ${{ github.workspace }}/security-reports
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Prepare report directory
        run: mkdir -p "$REPORTS"

      - name: Gitleaks secret scan
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          GL_TARBALL="gitleaks_8.30.1_linux_x64.tar.gz"
          GL_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$GL_TARBALL" \
            -o "$RUNNER_TEMP/gitleaks/$GL_TARBALL"
          (cd "$RUNNER_TEMP/gitleaks" && echo "$GL_SHA256  $GL_TARBALL" | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/gitleaks/$GL_TARBALL" -C "$RUNNER_TEMP/gitleaks" gitleaks
          set +e
          "$RUNNER_TEMP/gitleaks/gitleaks" git . \
            --log-opts="$BASE_SHA..$HEAD_SHA" \
            --redact --no-color --verbose \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks/report.json" \
            > "$RUNNER_TEMP/gitleaks/scan.log" 2>&1
          STATUS=$?
          set -e
          {
            if [ "$STATUS" -eq 0 ]; then
              echo "<!-- security-status: pass -->"
            else
              echo "<!-- security-status: fail -->"
            fi
            echo "### Gitleaks"
            echo
            echo "范围：PR 新增提交 \`$BASE_SHA..$HEAD_SHA\`"
            echo
            if [ "$STATUS" -eq 0 ]; then
              echo "✅ 未发现密钥泄露。"
            else
              echo "❌ 发现疑似密钥（仅显示位置，不显示密钥内容）："
              echo
              if [ -s "$RUNNER_TEMP/gitleaks/report.json" ]; then
                echo "| 文件 | 行 | 规则 | 提交 |"
                echo "| --- | --- | --- | --- |"
                jq -r '.[] | "| `\(.File | gsub("`"; "") | gsub("\\|"; "\\|"))` | \(.StartLine) | \(.RuleID) | \((.Commit // "")[0:8]) |"' \
                  "$RUNNER_TEMP/gitleaks/report.json" || echo "| - | - | - | - |"
              else
                echo "无法解析扫描结果，请查看运行日志。"
              fi
              echo
              echo "[查看 Actions 运行日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            fi
          } > "$REPORTS/gitleaks.md"
          cat "$REPORTS/gitleaks.md"
          exit "$STATUS"

      - name: Set up Python 3
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python3 -m pip install --disable-pip-version-check semgrep==1.182.1

      - name: Semgrep code scan
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/semgrep"
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          mapfile -t FILES < <(
            git diff --name-only --diff-filter=ACMR "$MERGE_BASE" "$HEAD_SHA" \
              | grep -E '\.(dart|py|sh|bash|yml|yaml|js|ts|json)$' \
              | grep -v -E '\.g\.dart$|^lib/l10n/app_localizations|^lib/injection/injector\.config\.dart$' \
              || true
          )
          if [ ${#FILES[@]} -eq 0 ]; then
            {
              echo "<!-- security-status: pass -->"
              echo "### Semgrep"
              echo
              echo "⏭️ PR 未修改可扫描文件，已跳过。"
            } > "$REPORTS/semgrep.md"
            cat "$REPORTS/semgrep.md"
            exit 0
          fi
          set +e
          semgrep scan \
            --config=p/default \
            --baseline-commit="$MERGE_BASE" \
            --severity WARNING \
            --error \
            --metrics=off \
            --disable-version-check \
            --json \
            "${FILES[@]}" > "$RUNNER_TEMP/semgrep/report.json" 2> "$RUNNER_TEMP/semgrep/scan.log"
          STATUS=$?
          set -e
          {
            if [ "$STATUS" -eq 0 ]; then
              echo "<!-- security-status: pass -->"
            else
              echo "<!-- security-status: fail -->"
            fi
            echo "### Semgrep"
            echo
            echo "范围：PR 修改的 ${#FILES[@]} 个文件"
            echo
            if [ "$STATUS" -eq 0 ]; then
              echo "✅ 未发现新问题。"
            elif [ "$STATUS" -eq 1 ]; then
              echo "❌ 发现问题（仅显示位置，不显示代码片段）："
              echo
              echo "| 文件 | 行 | 规则 | 级别 |"
              echo "| --- | --- | --- | --- |"
              jq -r '.results[] | "| `\(.path | gsub("`"; "") | gsub("\\|"; "\\|"))` | \(.start.line) | \(.check_id) | \(.extra.severity) |"' \
                "$RUNNER_TEMP/semgrep/report.json" || echo "| - | - | - | - |"
            else
              echo "⚠️ 扫描执行失败（退出码 $STATUS），请查看运行日志。"
            fi
            echo
            echo "[查看 Actions 运行日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > "$REPORTS/semgrep.md"
          cat "$REPORTS/semgrep.md"
          exit "$STATUS"

      - name: Detect dependency changes
        id: deps
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          if git diff --quiet "$MERGE_BASE" "$HEAD_SHA" -- pubspec.yaml pubspec.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes; skipping audit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Flutter and Environment
        if: steps.deps.outputs.changed == 'true'
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          flutter-version: "3.44.9"
          channel: "stable"
          cache: true

      - name: Dart dependency audit
        continue-on-error: true
        if: steps.deps.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dart-audit"
          set +e
          dart pub global activate dart_audit 0.3.1 > "$RUNNER_TEMP/dart-audit/activate.log" 2>&1
          ACTIVATE_STATUS=$?
          if [ "$ACTIVATE_STATUS" -eq 0 ]; then
            dart pub global run dart_audit audit --format json \
              > "$RUNNER_TEMP/dart-audit/report.json" 2> "$RUNNER_TEMP/dart-audit/scan.log"
            STATUS=$?
          else
            STATUS=$ACTIVATE_STATUS
          fi
          set -e
          REPORT="$RUNNER_TEMP/dart-audit/report.json"
          {
            if [ "$STATUS" -eq 0 ]; then
              echo "<!-- security-status: pass -->"
            else
              echo "<!-- security-status: fail -->"
            fi
            echo "### Dart Dependency Audit (OSV)"
            echo
            if [ -s "$REPORT" ] && jq -e . "$REPORT" >/dev/null 2>&1; then
              SCANNED=$(jq -r '.scanned // 0' "$REPORT")
              VULN_PKGS=$(jq -r '.vulnerablePackages // 0' "$REPORT")
              VULNS=$(jq -r '.totalVulnerabilities // 0' "$REPORT")
              if [ "$VULN_PKGS" -eq 0 ] && [ "$STATUS" -eq 0 ]; then
                echo "✅ 未发现已知漏洞（扫描 $SCANNED 个包）。"
              elif [ "$VULN_PKGS" -gt 0 ]; then
                echo "❌ 发现 $VULNS 个已知漏洞（涉及 $VULN_PKGS 个包）："
                echo
                echo "| 包 | 版本 | 级别 | 漏洞 | 修复版本 |"
                echo "| --- | --- | --- | --- | --- |"
                jq -r '.results[] as $p | $p.vulnerabilities[] | "| `\($p.name)` | \($p.version) | \(.severity) | \(.id) | \(.fixedVersion // "-") |"' \
                  "$REPORT" || echo "| - | - | - | - | - |"
              else
                echo "⚠️ 扫描异常退出（退出码 $STATUS），请查看运行日志。"
              fi
            else
              echo "⚠️ 扫描执行失败或结果无法解析，请查看运行日志。"
            fi
            echo
            echo "[查看 Actions 运行日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > "$REPORTS/dart-audit.md"
          cat "$REPORTS/dart-audit.md"
          exit "$STATUS"

      - name: Write skipped dart_audit report
        if: steps.deps.outcome == 'success' && steps.deps.outputs.changed != 'true'
        run: |
          {
            echo "<!-- security-status: pass -->"
            echo "### Dart Dependency Audit (OSV)"
            echo
            echo "⏭️ PR 未修改 pubspec.yaml / pubspec.lock，已跳过。"
          } > "$REPORTS/dart-audit.md"

      - name: Fail if any scan did not pass
        if: always()
        run: |
          set -u
          STATUS=0
          for tool in gitleaks semgrep dart-audit; do
            if [ ! -f "$REPORTS/$tool.md" ]; then
              {
                echo "<!-- security-status: fail -->"
                echo "### $tool"
                echo
                echo "⚠️ 扫描未完成，请查看运行日志。"
              } > "$REPORTS/$tool.md"
              echo "::error::$tool report missing"
              STATUS=1
            elif grep -q 'security-status: fail' "$REPORTS/$tool.md"; then
              echo "::error::$tool reported a problem"
              STATUS=1
            fi
          done
          exit "$STATUS"

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-report
          path: security-reports/
          if-no-files-found: error
          retention-days: 3
