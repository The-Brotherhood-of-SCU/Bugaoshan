name: Build Android

on:
  workflow_call:
    inputs:
      version:
        description: "tag name"
        required: false
        type: string
      build_name:
        description: "构建注入的 versionName（--build-name；预览=上一正式版，formal=pubspec）"
        required: false
        type: string
      build_number:
        description: "构建注入的 versionCode 基数（--build-number）"
        required: false
        type: string

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest
    env:
      # 与 F-Droid 构建统一走国内镜像源：提交的 pubspec.lock 是 pub.flutter-io.cn，
      # 设置 PUB_HOSTED_URL 后 pub get 才会按 lockfile 锁定版本（否则按 pub.dev
      # 重新解析，依赖版本随发布时间漂移，导致 kernel/libapp.so 不一致）。
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - uses: actions/checkout@v4

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            $HOME/.pub-cache
          key: android-pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            android-pub-${{ runner.os }}-

      - name: Setup build environment
        id: setup
        uses: ./.github/actions/setup
        with:
          version: ${{ inputs.version }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Decode Keystore
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/keystore/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo 'storePassword=${{ secrets.KEYSTORE_PASSWORD }}' > android/key.properties
          echo 'keyPassword=${{ secrets.KEY_PASSWORD }}' >> android/key.properties
          echo 'keyAlias=${{ secrets.KEY_ALIAS }}' >> android/key.properties
          echo 'storeFile=../keystore/upload-keystore.jks' >> android/key.properties

      - name: Disable dartjni build-id for reproducible builds
        run: |
          # libdartjni.so 会按构建路径生成非确定性的 build-id，
          # 与 F-Droid 构建机不一致，导致可复制构建逐字节比对失败。
          sed -i -E 's/(-Wl,)(--build-id=none,)?/\1--build-id=none,/' ${PUB_CACHE:-$HOME/.pub-cache}/hosted/*/jni-*/src/CMakeLists.txt

      - name: Build universal APK for in-app updates
        run: |
          # 版本注入：预览通道统一使用上一正式版的版本号（pubspec 的 /release bump
          # 不影响预览构建），formal 与 pubspec 一致；空值时回退 pubspec 默认。
          BUILD_ARGS=()
          if [ -n "${{ inputs.build_name }}" ]; then BUILD_ARGS+=(--build-name "${{ inputs.build_name }}"); fi
          if [ -n "${{ inputs.build_number }}" ]; then BUILD_ARGS+=(--build-number "${{ inputs.build_number }}"); fi
          flutter build apk --release \
            --obfuscate --split-debug-info=build/app/outputs/symbols/universal \
            "${BUILD_ARGS[@]}" \
            --dart-define=GIT_TAG=${{ steps.setup.outputs.GIT_TAG }} \
            --dart-define=GIT_COMMIT=${{ steps.setup.outputs.GIT_COMMIT }} \
            --dart-define=GIT_COMMIT_DATE=${{ steps.setup.outputs.GIT_COMMIT_DATE }}
          mkdir -p release-apks
          cp build/app/outputs/flutter-apk/app-release.apk \
            release-apks/app-universal-release.apk

      - name: Build ABI split APKs for manual downloads
        run: |
          BUILD_ARGS=()
          if [ -n "${{ inputs.build_name }}" ]; then BUILD_ARGS+=(--build-name "${{ inputs.build_name }}"); fi
          if [ -n "${{ inputs.build_number }}" ]; then BUILD_ARGS+=(--build-number "${{ inputs.build_number }}"); fi
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/app/outputs/symbols/split \
            "${BUILD_ARGS[@]}" \
            --dart-define=GIT_TAG=${{ steps.setup.outputs.GIT_TAG }} \
            --dart-define=GIT_COMMIT=${{ steps.setup.outputs.GIT_COMMIT }} \
            --dart-define=GIT_COMMIT_DATE=${{ steps.setup.outputs.GIT_COMMIT_DATE }}
          cp build/app/outputs/flutter-apk/app-*-release.apk release-apks/

      - name: Upload universal and split APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-apks/*.apk
