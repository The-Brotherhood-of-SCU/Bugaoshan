name: Security Scan Comment

on:
  workflow_run:
    workflows: ["Pre-flight Quality Checks"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

concurrency:
  group: security-report-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  comment:
    name: Post Security Scan Comment
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 本工作流运行在默认分支，不检出或执行 PR 代码；
      # 只下载 Pre-flight 扫描任务产出的 Markdown 报告。
      - name: Download scan reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: security-report-*
          merge-multiple: true
          path: reports

      - name: Resolve pull request number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ github.event.workflow_run.pull_requests[0].number }}"
          if [ -z "$PR" ]; then
            PR=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls" \
              -H "Accept: application/vnd.github+json" --jq '.[0].number // empty' || true)
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      - name: Post or update sticky comment
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          if ! ls reports/*.md >/dev/null 2>&1; then
            echo "No scan reports found; skipping comment."
            exit 0
          fi
          MARKER='<!-- security-scan-report -->'
          gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" > "$RUNNER_TEMP/comment-ids.txt"
          COMMENT_ID=$(sed -n '1p' "$RUNNER_TEMP/comment-ids.txt")
          if grep -q 'security-status: fail' reports/*.md; then
            {
              echo "$MARKER"
              echo "## 安全扫描结果"
              echo
              echo "[${{ github.event.workflow_run.name }} #${{ github.event.workflow_run.run_number }}](${{ github.event.workflow_run.html_url }})"
              echo
              for file in reports/gitleaks.md reports/semgrep.md reports/dart-audit.md; do
                if [ -f "$file" ]; then
                  cat "$file"
                  echo
                fi
              done
              echo "_由 Security Scan Comment 工作流自动更新。_"
            } > body.md
            if [ -n "$COMMENT_ID" ]; then
              gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -F body=@body.md >/dev/null
            else
              gh api -X POST "repos/${{ github.repository }}/issues/$PR/comments" -F body=@body.md >/dev/null
            fi
          elif [ -n "$COMMENT_ID" ]; then
            # 之前报告过问题，本次全部通过：更新旧评论，避免陈旧信息误导
            {
              echo "$MARKER"
              echo "## 安全扫描结果"
              echo
              echo "✅ 本次运行未发现新问题（此前报告的问题已解决或不再出现）。"
              echo
              echo "[${{ github.event.workflow_run.name }} #${{ github.event.workflow_run.run_number }}](${{ github.event.workflow_run.html_url }})"
              echo
              echo "_由 Security Scan Comment 工作流自动更新。_"
            } > body.md
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -F body=@body.md >/dev/null
          else
            echo "All security checks passed; no comment."
          fi
