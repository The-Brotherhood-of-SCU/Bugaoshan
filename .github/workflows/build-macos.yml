name: Build macOS

on:
  workflow_call:
    inputs:
      build_name:
        type: string
        required: false
      build_number:
        type: string
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-macos:
    name: macOS universal build validation
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      COCOAPODS_DISABLE_STATS: 'true'
      MACOS_BUILD_NAME: ${{ inputs.build_name }}
      MACOS_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Compile and verify app and widget for arm64 and x86_64
        run: bash tool/macos_distribution.sh unsigned
      - name: Upload unsigned validation bundle (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: macos-validation-unsigned
          path: build/macos/validation/Bugaoshan-unsigned.zip
          if-no-files-found: error
          retention-days: 7
