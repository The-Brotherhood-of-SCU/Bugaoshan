name: Close Linked Issues

# 本仓库采用 preview -> main 两级发布：特性与修复的 PR 目标分支是 preview，
# 而 GitHub 原生关键字（Closes / Fixes #N）只在合入**默认分支 main** 时才自动
# 关闭 issue。为了让预览阶段合入的修复也能及时关闭对应 issue，这里显式处理：
# 带 `close issue` 标签的 PR 合入时，解析标题与正文里的关键字并关闭对应 issue。
#
# 未打该标签的 PR 不受影响，仍交给 GitHub 原生行为（合入 main 时关闭）。

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  close-linked-issues:
    name: Close Issues Referenced by This PR
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close linked issues
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const hasLabel = pr.labels.some((l) => l.name === 'close issue');
            if (!hasLabel) {
              core.info(`PR #${pr.number} 未带 "close issue" 标签，跳过（交给 GitHub 原生行为）。`);
              return;
            }

            // 只认标准关键字闭包：close/closes/closed、fix/fixes/fixed、
            // resolve/resolves/resolved，紧跟可选冒号与可选空白后接 #N
            // （与 GitHub 原生关键字形态对齐；"Fixes the thing #12" 不算）。
            const keyword = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\b\s*:?\s*#(\d+)/gi;
            const text = `${pr.title}\n${pr.body ?? ''}`;
            const numbers = new Set();
            for (const match of text.matchAll(keyword)) {
              numbers.add(Number(match[1]));
            }

            if (numbers.size === 0) {
              core.warning(
                `PR #${pr.number} 带 "close issue" 标签，但标题与正文里没有找到 ` +
                `Closes/Fixes/Resolves #N 形式的引用，没有可关闭的 issue。`,
              );
              return;
            }

            for (const issue_number of numbers) {
              if (issue_number === pr.number) {
                core.info(`跳过 #${issue_number}：与被合并的 PR 自身同号。`);
                continue;
              }
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                });
                if (issue.pull_request) {
                  core.info(`跳过 #${issue_number}：这是一个 PR，不是 issue。`);
                  continue;
                }
                if (issue.state === 'closed') {
                  core.info(`#${issue_number} 已经关闭，跳过。`);
                  continue;
                }
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  body: `随 #${pr.number} 合入 \`${pr.base.ref}\` 关闭（\`close issue\` 标签）。`,
                });
                core.info(`已关闭 #${issue_number}。`);
              } catch (error) {
                core.warning(`处理 #${issue_number} 失败：${error.message}`);
              }
            }
