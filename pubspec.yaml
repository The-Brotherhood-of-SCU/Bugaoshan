name: bugaoshan
description: Explore everything, all on the Bugaoshan.
publish_to: none
version: 2.5.2+20502
environment:
  sdk: ^3.10.4
dependencies:
  flutter:
    sdk: flutter
  photo_view: ^0.15.0
  get_it: ^9.2.0
  injectable: any
  shared_preferences: any
  flutter_app_group_directory: ^1.1.0
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_colorpicker: any
  url_launcher: any
  package_info_plus: any
  async: any
  http: ^1.2.0
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.4
  path_provider: ^2.1.5
  path: ^1.9.0
  dart_sm: ^0.1.4
  flutter_secure_storage: ^10.0.0
  scu_ocr_lite:
    git:
      url: https://github.com/The-Brotherhood-of-SCU/scu_ocr_lite_dart.git
  archive: ^4.0.9
  os_type: ^0.2.2
  crypto: ^3.0.0
  file_picker: ^12.0.0
  fl_chart: ^1.2.0
  flutter_markdown_plus: ^1.0.7
  image_picker: ^1.2.2
  window_manager: ^0.5.1
  screen_retriever: ^0.2.0
  system_theme: ^3.2.0
  google_fonts: ^8.1.0
  share_plus: ^13.1.0
  gal: ^2.3.0
  # CPF 5.1.1，包含 OH 实现。
  image_gallery_saver_plus:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_image_gallery_saver_plus.git
      ref: 4297d23fd7b1b707e6c4b5b0d73fd387e851fc8f
  open_filex: ^4.7.0
  open_file_ohos:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_open_file.git
      ref: 85db425fc4b8cc403983fc854a36da6f300ad952
      path: ohos
  flutter_inappwebview:
    git:
      url: https://github.com/The-Brotherhood-of-SCU/flutter_inappwebview.git
      ref: a3880161e8e8630eef76c22762f5ab5045c5781c
      path: flutter_inappwebview
  tyme: ^1.4.4
  json_annotation: ^4.12.0
  device_info_plus: ^13.2.0
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: any
  injectable_generator: any
  json_serializable: any
  flutter_launcher_icons: ^0.14.1
  fake_async: ^1.3.0

# 其他 OH 平台包的来源覆盖；根锁保留 main 基线，依赖解析由维护者执行。
dependency_overrides:
  shared_preferences_ohos:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      ref: 4c19d0ade6deb07620921fdcaa3afbb0586dd541
      path: packages/shared_preferences/shared_preferences_ohos
  image_picker_ohos:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      ref: 4c19d0ade6deb07620921fdcaa3afbb0586dd541
      path: packages/image_picker/image_picker_ohos
  path_provider_ohos:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      ref: 7cc9f4cfbd464943096dc7c87288252c543df5cb
      path: packages/path_provider/path_provider_ohos
  sqflite_ohos:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_sqflite.git
      ref: 5ef0761001378455e872e46d1c0620d39dcc1002
      path: sqflite_ohos
  url_launcher_ohos:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      ref: f31db0d72e7a1d91dd023325a23dc2fba4b6ce4b
      path: packages/url_launcher/url_launcher_ohos
  # 本地 CPF 工作副本内的独立 OH 包；修改直接在各自 Git 仓库保存。
  package_info_plus_ohos:
    path: ohos/vendor/cpf/package_info_plus/packages/package_info_plus/package_info_plus_ohos
  share_plus_ohos:
    path: ohos/vendor/cpf/share_plus/packages/share_plus/share_plus_ohos

# sqlite3 构建 hook 默认从 github.com 下载预编译 SQLite 库（国内网络超时）。
# 通过镜像 url_pattern 拉取官方同款二进制。$RELEASE_TAG / $FILENAME 由 hook 自动替换。
hooks:
  user_defines:
    sqlite3:
      url_pattern: "https://gh-proxy.com/https://github.com/simolus3/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/js/
    - assets/scripts/
    - CHANGELOG.md
  config:
    enable-swift-package-manager: false
flutter_launcher_icons:
  android: true
  ios: true
  adaptive_icon_foreground: "assets/icon-foreground.png"
  adaptive_icon_background: "#FFFFFF"
  web:
    generate: true
    image_path: assets/icon.png
  windows:
    generate: true
    image_path: assets/icon.png
  macos:
    generate: true
    image_path: assets/icon.png
  linux:
    generate: true
    image_path: assets/icon.png
  image_path: assets/icon.png
