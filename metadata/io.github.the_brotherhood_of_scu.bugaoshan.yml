# F-Droid Build Metadata for Bugaoshan
# Application ID: io.github.the_brotherhood_of_scu.bugaoshan
# See: https://f-droid.org/en/docs/Build_Metadata_Reference/
#
# 本应用采用「可复制构建」（Reproducible Builds）发布：
# F-Droid 构建服务器从源码构建未签名 APK，与 binary: 指向的 GitHub Release
# APK（CI 用同一 tag、相同构建参数构建并签名）逐字节比对；一致则直接发布
# 开发者签名的 APK。因此 F-Droid 与 GitHub 渠道的安装包签名一致，可互相覆盖安装。
#
# 为保证逐字节一致，本 recipe 与 CI（.github/workflows/build-android.yml）严格对齐：
#   - 相同 Flutter 版本（srclibs flutter@3.44.8 == .github/actions/setup）
#   - 相同构建参数：--release --split-per-abi --obfuscate --split-debug-info + 相同的 dart-define
#     （GIT_TAG / GIT_COMMIT / GIT_COMMIT_DATE；均无构建时间戳等非确定性输入）
#   - prebuild 复刻 CI 的代码生成步骤（build_runner、gen-l10n）
#   - 两侧（CI 与 F-Droid prebuild/build）均设置 PUB_HOSTED_URL=https://pub.flutter-io.cn：
#     提交的 pubspec.lock 是 pub.flutter-io.cn 镜像源，设置 PUB_HOSTED_URL 后 pub get
#     才会按 lockfile 锁定版本；否则 pub 会按 pub.dev 重新解析，依赖版本随发布时间漂移
#     （2026-08 实测 sqflite_common_ffi 2.4.2→2.4.2+1、synchronized 3.4.1+1→3.4.1+2
#     导致 kernel/libapp.so 不一致）。
#   - taskset --cpu-list 0-15：固定构建 CPU 亲和性（同 Traintime PDA/XDYou 的
#     F-Droid recipe），消除 gen_snapshot 并行度差异。
#
# versionCode 规则（与 Flutter --split-per-abi 的自动偏移一致，
# 见 flutter_tools FlutterPlugin.kt：versionCode = abiCode*1000 + base）：
#   base      = major*10000 + minor*100 + patch（pubspec.yaml 中 version 的 +N 部分）
#   universal = base
#   v7a       = base + 1000
#   v8a       = base + 2000
#   x86_64    = base + 4000
#
# 注意：v2.3.0 的 Release 资产实际由 commit ba5312a 构建上传
# （main 分支，2026-08-15 00:08:16 +0800，BUILD_TIME 已移除之后），
# 而非 v2.3.0 tag 指向的旧提交 fcadf208。因此 build entry 的 commit
# 固定为该 SHA。
#
# GIT_TAG 直接从 pubspec 版本推导（v2.3.0），不要用「最新 tag」逻辑——
# 仓库里的 v2.3.0-test-fdroid-ci 等测试 tag 会排在 v2.3.0 前面，导致
# dart-define 与 CI 产物不一致。
#
# prebuild 中对 jni 包的 CMakeLists.txt 注入 -Wl,--build-id=none：
# libdartjni.so 会按构建路径生成非确定性的 build-id（见 F-Droid
# Reproducible_Builds 文档），F-Droid 构建机路径与 CI 不同导致字节不一致。
# CI（.github/workflows/build-android.yml）已同步禁用 build-id，
# 重新发布 v2.3.0 资产后两边的 libdartjni.so 才会一致。
#
# 构建目录镜像：dart_plugin_registrant.dart 的绝对路径会编入 libapp.so
# （含混淆符号哈希），因此 prebuild/build 先把源码 mv 到与 CI 相同的
# /home/runner/work/Bugaoshan/Bugaoshan 下构建，再移回原位（做法同
# flutter_server_box 的 fdroiddata recipe）。CI 侧无需为此改动。
#
# Flutter SDK 路径镜像：Flutter SDK 源码 URI 同样会编入 kernel，CI 通过
# subosito/flutter-action 把 SDK 装在 /opt/hostedtoolcache/flutter/stable-3.44.8-x64。
# 因此 prebuild 先把 srclib 的 flutter 移到该路径（保留 $$flutter$$ 符号链接），
# build 结束后移回；移动前先清理上次运行可能残留的状态，保证可重复执行。
#
# Pub 缓存路径镜像：dart pub get 会把 $PUB_CACHE 的绝对路径写进
# .dart_tool/package_config.json 并编入 kernel（dill），CI 上是
# /home/runner/.pub-cache。因此 prebuild 里 export PUB_CACHE=/home/runner/.pub-cache，
# 并把该路径符号链接到本机构建用户的 /home/vagrant/.pub-cache（避免重新下载），
# 保证 package_config 与 CI 逐字一致；build 阶段同样 export 以保持一致。
#
# 提交 fdroiddata 前的检查项：
#   1. 对应 tag 已推送，且 GitHub Release 已发布（binary: URL 必须可下载）
#   2. 本地 docker 中 `fdroid build --verify` 通过
#   3. AllowedAPKSigningKeys 已补充（release keystore 证书的 SHA-256，
#      取自 apksigner verify --print-certs bugaoshan_2.3.0_arm64-v8a.apk）

Categories:
  - Science & Education
License: AGPL-3.0-only
AuthorName: The-Brotherhood-of-SCU
WebSite: https://github.com/The-Brotherhood-of-SCU/Bugaoshan
SourceCode: https://github.com/The-Brotherhood-of-SCU/Bugaoshan
IssueTracker: https://github.com/The-Brotherhood-of-SCU/Bugaoshan/issues
Changelog: https://github.com/The-Brotherhood-of-SCU/Bugaoshan/blob/main/CHANGELOG.md

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
VercodeOperation:
  - '%c + 1000'
  - '%c + 2000'
  - '%c + 4000'

RepoType: git
Repo: https://github.com/The-Brotherhood-of-SCU/Bugaoshan.git

Builds:
  # ----- armeabi-v7a (versionCode = base + 1000) -----
  - versionName: '2.3.0'
    versionCode: 21300
    commit: v2.3.0
    srclibs:
      - flutter@3.44.8
    rm:
      - .github
      - ios
      - linux
      - macos
      - windows
      - web
    sudo:
      - mkdir -p /home/runner
      - chown vagrant /home/runner
      - mkdir -p /opt/hostedtoolcache/flutter
      - chown vagrant /opt/hostedtoolcache/flutter
    prebuild:
      - export repo=/home/runner/work/Bugaoshan
      - mkdir -p $repo
      - export PUB_CACHE=/home/runner/.pub-cache
      - export PUB_HOSTED_URL=https://pub.flutter-io.cn
      - if [ -e /home/runner/.pub-cache ] && [ ! -L /home/runner/.pub-cache ]; then rm -rf /home/runner/.pub-cache; fi
      - if [ ! -e /home/runner/.pub-cache ]; then mkdir -p /home/vagrant/.pub-cache; ln -s /home/vagrant/.pub-cache /home/runner/.pub-cache; fi
      - if [ -L $$flutter$$ ]; then rm $$flutter$$; fi
      - if [ ! -e $$flutter$$ ] && [ -e /opt/hostedtoolcache/flutter/stable-3.44.8-x64 ]; then mv /opt/hostedtoolcache/flutter/stable-3.44.8-x64 $$flutter$$; fi
      - rm -rf /opt/hostedtoolcache/flutter/stable-3.44.8-x64
      - mv $$flutter$$ /opt/hostedtoolcache/flutter/stable-3.44.8-x64
      - ln -s /opt/hostedtoolcache/flutter/stable-3.44.8-x64 $$flutter$$
      - cd ..
      - rm -rf $repo/Bugaoshan
      - mv io.github.the_brotherhood_of_scu.bugaoshan $repo/Bugaoshan
      - pushd $repo/Bugaoshan
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - sed -i -E 's/(-Wl,)(--build-id=none,)?/\1--build-id=none,/' ${PUB_CACHE:-$HOME/.pub-cache}/hosted/*/jni-*/src/CMakeLists.txt
      - $$flutter$$/bin/dart run build_runner build --delete-conflicting-outputs || true
      - $$flutter$$/bin/flutter gen-l10n
      - popd
      - mv $repo/Bugaoshan io.github.the_brotherhood_of_scu.bugaoshan
    build:
      - export repo=/home/runner/work/Bugaoshan
      - export PUB_CACHE=/home/runner/.pub-cache
      - export PUB_HOSTED_URL=https://pub.flutter-io.cn
      - cd ..
      - rm -rf $repo/Bugaoshan
      - mv io.github.the_brotherhood_of_scu.bugaoshan $repo/Bugaoshan
      - pushd $repo/Bugaoshan
      - "export GIT_TAG=v$(grep '^version:' pubspec.yaml | sed 's/.*version: *//; s/+.*//')"
      - export GIT_COMMIT=$(git rev-parse HEAD)
      - export GIT_COMMIT_DATE=$(git log -1 --format=%ci)
      - "taskset --cpu-list 0-15 $$flutter$$/bin/flutter build apk --release --split-per-abi --build-number=$(( $(grep '^version:' pubspec.yaml | sed 's/.*version: *//; s/+.*//' | awk -F. '{print $1*10000 + $2*100 + $3}') )) --obfuscate --split-debug-info=build/app/outputs/symbols/fdroid --dart-define=GIT_TAG=$GIT_TAG --dart-define=GIT_COMMIT=$GIT_COMMIT --dart-define=GIT_COMMIT_DATE=\"$GIT_COMMIT_DATE\""
      - popd
      - mv $repo/Bugaoshan io.github.the_brotherhood_of_scu.bugaoshan
      - rm -rf $$flutter$$
      - mv /opt/hostedtoolcache/flutter/stable-3.44.8-x64 $$flutter$$
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: https://github.com/The-Brotherhood-of-SCU/Bugaoshan/releases/download/v%v/bugaoshan_%v_armeabi-v7a.apk
    gradleprops:
      - android.r8.failOnMissingClasses=false

